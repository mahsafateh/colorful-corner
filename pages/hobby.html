<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <title>Hobby | Masal's Colorful Corner</title>

<body id="hobby-page">
    <header id="site-header">
        <nav class="site-nav">
            <a class="logo" href="../index.html">Colorful Corner</a>
            <ul class="nav-links">
                <li><a href="../index.html">Home</a></li>
                <li><a href="home.html">About</a></li>
                <li><a href="portfolio.html">Work</a></li>
                <li><a href="hobby.html" aria-current="page">Hobby</a></li>
            </ul>
        </nav>
    </header>

    <main class="page">
        <section class="page-intro">
            <h1>The Gallery</h1>
            <p>A small exhibition of my watercolor worlds: quiet lakes, starry skies, fairies and dreamy seas.</p>
        </section>

        <section class="gallery">
            <figure class="artwork artwork--wide">
                <img src="../assets/front.png" alt="Watercolor of a misty lake with a wooden dock, a seagull on a post, a fishing rod and a tackle box">
                <figcaption>Morning at the Lake</figcaption>
            </figure>

            <figure class="artwork">
                <img src="../assets/front-fairytale.png" alt="The Little Prince with a yellow scarf sitting on a full moon beside a rose under glass, a fox riding a rocket among stars">
                <figcaption>The Little Prince's Moon</figcaption>
            </figure>

            <figure class="artwork">
                <img src="../assets/front-space.png" alt="Two bears made of constellations touching noses under a pastel pink and purple galaxy">
                <figcaption>Star Bears</figcaption>
            </figure>

            <figure class="artwork">
                <img src="../assets/back-fairytale.png" alt="A fairy with a star wand flying from a pink cloud toward a rainbow and an orange sun">
                <figcaption>Rainbow Fairy</figcaption>
            </figure>

            <figure class="artwork">
                <img src="../assets/back-space.png" alt="Whales, manta rays, jellyfish and an octopus in a flying saucer swimming through a lavender sky">
                <figcaption>The Sky Ocean</figcaption>
            </figure>
        </section>
    </main>

    <footer class="site-footer">
